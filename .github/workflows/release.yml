name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/maintainer64/cms-labs-capture:${{ steps.version.outputs.value }}
            ghcr.io/maintainer64/cms-labs-capture:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: >-
          helm package charts/cms-labs-capture --destination dist
          --version "${{ steps.version.outputs.value }}"
          --app-version "${{ steps.version.outputs.value }}"
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - run: helm push "dist/cms-labs-capture-${{ steps.version.outputs.value }}.tgz" oci://ghcr.io/maintainer64/charts
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
